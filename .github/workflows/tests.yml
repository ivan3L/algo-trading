name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/**"]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet "alpaca-py>=0.44" "pandas>=2.2" pytest
      - run: python -m pytest -q
