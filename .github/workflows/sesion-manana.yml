name: Sesión de mañana (paper)
on:
  schedule:
    - cron: "0 13 * * 1-5"   # 9:00 en Nueva York con horario de verano (EDT)
    - cron: "0 14 * * 1-5"   # 9:00 en Nueva York con horario de invierno (EST)
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar la comprobación de horario"
        type: boolean
        default: true
concurrency:
  group: motor-sesion
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sesion:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet "alpaca-py>=0.44" "pandas>=2.2"
      - name: Ejecutar ventana de mañana
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/run_session.py --window morning --cron-utc-hours 13 14 ${{ inputs.force == true && '--force' || '' }}
      - name: Guardar diario, estado y dashboard
        if: always()
        run: |
          git config user.name "motor-bot"
          git config user.email "motor-bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Sesión de mañana $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase --quiet && git push && break || sleep 15; done
